<html lang="en" data-theme="dark">

    <title>Nur Mohammad Bijoy — Software Engineer &amp; Information Security</title>

      name="description"
      content="Personal website of Nur Mohammad Bijoy: software engineer building secure systems. Projects, research, advanced skills and live open-source activity."

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <meta property="og:type" content="website" />

    <meta name="twitter:card" content="summary" />

    <!-- Apply the saved (or system) theme before first paint to avoid a flash. -->
    <script>
      try {
        var t = localStorage.getItem('theme')
        if (t !== 'light' && t !== 'dark') {
          t = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'
        }
        document.documentElement.dataset.theme = t
      } catch (e) {
        document.documentElement.dataset.theme = 'dark'
      }
    </script>

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Nur Mohammad Bijoy",
        "url": "https://nurbijoy.github.io/",
        "jobTitle": "Software Engineer",
        "sameAs": ["https://github.com/nurbijoy"],
        "knowsAbout": ["Software engineering", "Information security", "Cryptography", "Web development"]
      }
    </script>
  </head>

    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
